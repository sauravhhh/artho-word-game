<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artho Word Game</title>
<style>
  :root {
    --ink: #1a1a1a;
    --muted: #6b7280;
    --line: #e5e7eb;
    --bg: #fafafa;
    --card: #ffffff;
    --green: #15803d;
    --green-bg: #dcfce7;
    --red: #b91c1c;
    --red-bg: #fee2e2;
    --accent: #ff4d00;
    --amber: #d97706;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  header {
    width: 100%;
    max-width: 560px;
    padding: 28px 20px 8px;
    text-align: center;
  }
  header h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
  header h1 span { font-weight: 400; color: var(--accent); }
  header p { color: var(--muted); font-size: 14px; margin-top: 4px; }
  main { width: 100%; max-width: 560px; padding: 12px 20px 32px; flex: 1; }
  .screen { display: none; }
  .screen.active { display: block; animation: fadeIn .3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0% { transform: scale(1); } 40% { transform: scale(1.03); } 100% { transform: scale(1); } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-4px); } }

  /* ---- set picker ---- */
  .sets { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .set-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 14px;
    text-align: left;
    cursor: pointer;
    font: inherit;
    transition: border-color .15s, transform .1s;
    animation: fadeIn .35s ease both;
  }
  .set-card.tier-easy { border-left: 4px solid var(--green); }
  .set-card.tier-medium { border-left: 4px solid var(--amber); }
  .set-card.tier-hard { border-left: 4px solid var(--red); }
  .set-card:active { transform: scale(0.98); }
  .set-card:hover { border-color: var(--ink); }
  .set-card h2 { font-size: 16px; font-weight: 700; }
  .set-card p { color: var(--muted); font-size: 13px; margin-top: 4px; min-height: 32px; }
  .set-card .count {
    display: inline-block; margin-top: 8px;
    font-size: 12px; font-weight: 600; color: var(--muted);
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 9px;
  }
  .set-card .diff {
    display: inline-block; margin-top: 8px; margin-left: 4px;
    font-size: 12px; font-weight: 700;
    border-radius: 999px; padding: 3px 9px;
  }
  .set-card .diff.easy { color: var(--green); background: var(--green-bg); }
  .set-card .diff.medium { color: #92400e; background: #fef3c7; }
  .set-card .diff.hard { color: var(--red); background: var(--red-bg); }
  .section-label { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 8px 2px 12px; }
  .section-label.easy { color: var(--green); }
  .section-label.medium { color: var(--amber); }
  .section-label.hard { color: var(--red); }

  /* ---- quiz ---- */
  .hud {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 14px; font-weight: 600; margin-bottom: 10px;
  }
  .hud .streak { color: var(--muted); font-weight: 500; }
  .progress { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 20px; }
  .progress > div { height: 100%; background: var(--accent); width: 0%; transition: width .3s; }
  .clue-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 36px 20px 28px; text-align: center; margin-bottom: 16px;
  }
  .clue-card.q-in { animation: fadeIn .3s ease; }
  .clue-card .clue { font-size: 44px; font-weight: 700; line-height: 1.2; }
  .clue-card .roman { color: var(--muted); font-size: 17px; margin-top: 8px; font-style: italic; }
  .clue-card .prompt { color: var(--muted); font-size: 13px; margin-top: 18px; }
  .options { display: grid; gap: 10px; }
  .opt {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 15px 16px; font: inherit; font-size: 17px; text-align: left;
    cursor: pointer; transition: border-color .15s, background .15s;
    width: 100%;
  }
  .opt:hover:not(:disabled) { border-color: var(--ink); }
  .opt:disabled { cursor: default; opacity: .85; }
  .opt.correct { background: var(--green-bg); border-color: var(--green); color: var(--green); font-weight: 700; animation: pulse .45s ease; }
  .opt.wrong { background: var(--red-bg); border-color: var(--red); color: var(--red); animation: shake .4s ease; }
  #hud-score.pop { display: inline-block; animation: pop .35s ease; }
  .quit {
    display: block; margin: 18px auto 0; background: none; border: none;
    font: inherit; font-size: 14px; color: var(--muted); cursor: pointer; text-decoration: underline;
  }

  /* ---- results ---- */
  .result-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 32px 24px; text-align: center;
  }
  .result-card .big { font-size: 52px; font-weight: 800; letter-spacing: -0.02em; }
  .result-card .of { color: var(--muted); font-size: 16px; margin-top: 2px; }
  .result-card .stats { display: flex; justify-content: center; gap: 28px; margin-top: 20px; }
  .result-card .stats div b { display: block; font-size: 22px; }
  .result-card .stats div span { color: var(--muted); font-size: 13px; }
  .result-card .msg { margin-top: 16px; font-size: 16px; }
  .result-card .trophy { display: none; font-size: 64px; line-height: 1; margin-bottom: 6px; }
  .result-card .trophy.show { display: block; animation: pop .45s ease; }
  @keyframes pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
  #share-btn { display: none; }
  #share-btn.show { display: block; }
  #confetti-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; display: none; }
  .btn {
    display: block; width: 100%; margin-top: 12px; padding: 15px;
    border-radius: 12px; font: inherit; font-size: 16px; font-weight: 700;
    cursor: pointer; border: 1px solid var(--ink);
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.ghost { background: var(--card); color: var(--ink); }
  footer { padding: 0 20px 24px; color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Artho <span>Word Game</span></h1>
  <p>অসমীয়া clue, English answer — how many can you get right?</p>
</header>

<main>
  <!-- SET PICKER -->
  <section id="screen-sets" class="screen active">
    <div class="section-label">Pick a word set</div>
    <div id="sets"></div>
    <p id="sets-status" style="color:var(--muted);font-size:13px;margin-top:14px;"></p>
  </section>

  <!-- QUIZ -->
  <section id="screen-quiz" class="screen">
    <div class="hud">
      <span id="hud-q">Question 1 of 10</span>
      <span>Score <b id="hud-score">0</b></span>
      <span class="streak">🔥 <span id="hud-streak">0</span></span>
    </div>
    <div class="progress"><div id="progress-bar"></div></div>
    <div class="clue-card">
      <div class="clue" id="clue">—</div>
      <div class="roman" id="roman"></div>
      <div class="prompt">What does this mean in English?</div>
    </div>
    <div class="options" id="options"></div>
    <button class="quit" id="quit-btn">Quit — back to sets</button>
  </section>

  <!-- RESULTS -->
  <section id="screen-result" class="screen">
    <div class="result-card">
      <div class="trophy" id="trophy">🏆</div>
      <div class="big" id="result-score">0 / 10</div>
      <div class="of" id="result-set">Animals</div>
      <div class="stats">
        <div><b id="result-correct">0</b><span>correct</span></div>
        <div><b id="result-acc">0%</b><span>accuracy</span></div>
        <div><b id="result-best">0</b><span>best streak</span></div>
      </div>
      <div class="msg" id="result-msg"></div>
      <button class="btn primary" id="again-btn" style="margin-top:24px;">Play again</button>
      <button class="btn ghost" id="change-btn">Home</button>
      <button class="btn ghost" id="share-btn">Share my score</button>
    </div>
  </section>
</main>

<footer>Words from XOBDO · Artho Word Game</footer>
<canvas id="confetti-canvas"></canvas>

<script>
"use strict";
var QUESTIONS_PER_ROUND = 10;
var API_BASE = "https://xobdo.org/api";

var sets = null;        // [{ID, SetName, descrip, cnt}]
var currentSet = null;  // set object being played
var cards = [];         // valid cards of the current set
var round = [];         // shuffled questions for this round
var qIndex = 0, score = 0, streak = 0, bestStreak = 0, locked = false;

function show(id) {
  document.querySelectorAll(".screen").forEach(function (s) { s.classList.remove("active"); });
  document.getElementById(id).classList.add("active");
}

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

function validCards(list) {
  return (list || []).filter(function (c) {
    return c && typeof c.clue === "string" && c.clue.trim() &&
           typeof c.answer === "string" && c.answer.trim();
  });
}

// Try the live XOBDO API first; fall back to the bundled JSON silently.
function fetchJson(url, timeoutMs) {
  return new Promise(function (resolve) {
    var done = false;
    var timer = setTimeout(function () { if (!done) { done = true; resolve(null); } }, timeoutMs || 8000);
    fetch(url).then(function (r) {
      if (!r.ok) throw new Error("http " + r.status);
      return r.text();
    }).then(function (text) {
      if (done) return;
      done = true; clearTimeout(timer);
      try { resolve(JSON.parse(text)); } catch (e) { resolve(null); }
    }).catch(function () {
      if (done) return;
      done = true; clearTimeout(timer); resolve(null);
    });
  });
}

function loadSets() {
  return fetchJson(API_BASE + "/wordgames.php").then(function (live) {
    if (Array.isArray(live) && live.length) { sets = live; return "live"; }
    return fetch("data/sets.json").then(function (r) { return r.json(); }).then(function (local) {
      sets = local; return "bundled";
    }).catch(function () { sets = []; return "none"; });
  });
}

function loadCards(setId) {
  return fetchJson(API_BASE + "/wordgames_cards.php?set=" + encodeURIComponent(setId)).then(function (live) {
    var good = validCards(live);
    if (good.length >= 4) { cards = good; return; }
    return fetch("data/set-" + setId + ".json").then(function (r) { return r.json(); }).then(function (local) {
      cards = validCards(local);
    }).catch(function () { cards = []; });
  });
}

// Difficulty by set ID, so the picker runs easy → hard.
// Easy: concrete everyday words. Medium: grammar words. Hard: phrases
// and sentences. Unknown sets (e.g. new ones from the live API) land in
// Medium so they still show up.
var DIFFICULTY = {
  "21": "easy", "1": "easy", "2": "easy", "3": "easy",
  "19": "easy", "22": "easy", "5": "easy", "6": "easy",
  "12": "medium", "17": "medium", "20": "medium", "13": "medium",
  "15": "medium", "16": "medium", "18": "medium",
  "14": "medium", "27": "medium", "28": "medium",
  "7": "hard", "8": "hard", "9": "hard", "10": "hard",
  "4": "hard", "23": "hard", "29": "hard"
};
// Only these sets are shown in the picker — 12 everyday sets instead of
// all 25. The rest stay bundled in data/ so any of them can be added back.
var FEATURED_SETS = ["1", "2", "19", "21", "3", "22", "12", "20", "13", "14", "7", "4"];
function difficultyOf(s) { return DIFFICULTY[s.ID] || "medium"; }

function renderSets() {
  var box = document.getElementById("sets");
  box.innerHTML = "";
  var shown = sets.filter(function (s) { return FEATURED_SETS.indexOf(s.ID) !== -1; });
  [["easy", "Easy"], ["medium", "Medium"], ["hard", "Hard"]].forEach(function (tier) {
    var list = shown.filter(function (s) { return difficultyOf(s) === tier[0]; });
    if (!list.length) return;
    var label = document.createElement("div");
    label.className = "section-label " + tier[0];
    label.textContent = tier[1];
    box.appendChild(label);
    var grid = document.createElement("div");
    grid.className = "sets";
    list.forEach(function (s, i) {
      var b = document.createElement("button");
      b.className = "set-card tier-" + tier[0];
      b.style.animationDelay = (i * 30) + "ms";
      b.innerHTML = "<h2></h2><p></p><span class='count'></span> <span class='diff'></span>";
      b.querySelector("h2").textContent = s.SetName;
      b.querySelector("p").textContent = s.descrip || "Word set";
      b.querySelector(".count").textContent = s.cnt + " words";
      var d = b.querySelector(".diff");
      d.textContent = tier[1];
      d.classList.add(tier[0]);
      b.addEventListener("click", function () { startRound(s); });
      grid.appendChild(b);
    });
    box.appendChild(grid);
  });
  document.getElementById("sets-status").textContent =
    shown.length + " sets · " + shown.reduce(function (n, s) { return n + (parseInt(s.cnt, 10) || 0); }, 0) + " words";
}

function buildOptions(card, pool) {
  var answers = [];
  var seen = {};
  seen[String(card.answer).toLowerCase()] = true;
  var others = shuffle(pool.filter(function (c) { return c !== card; }));
  for (var i = 0; i < others.length && answers.length < 3; i++) {
    var a = others[i].answer;
    var k = String(a).toLowerCase();
    if (!seen[k]) { seen[k] = true; answers.push(a); }
  }
  // Extremely small sets: pad with the correct answer's neighbours is not
  // possible; fall back to reusing other answers if needed.
  while (answers.length < 3) { answers.push("(no other word)"); }
  answers.push(card.answer);
  return shuffle(answers);
}

function startRound(setObj) {
  stopConfetti();
  currentSet = setObj;
  document.getElementById("sets-status").textContent = "Loading " + setObj.SetName + "…";
  loadCards(setObj.ID).then(function () {
    if (cards.length < 4) {
      document.getElementById("sets-status").textContent = "Could not load this set. Try another one.";
      show("screen-sets");
      return;
    }
    round = shuffle(cards.slice()).slice(0, QUESTIONS_PER_ROUND);
    qIndex = 0; score = 0; streak = 0; bestStreak = 0;
    show("screen-quiz");
    renderQuestion();
  });
}

function renderQuestion() {
  locked = false;
  var card = round[qIndex];
  var cc = document.querySelector(".clue-card");
  cc.classList.remove("q-in"); void cc.offsetWidth; cc.classList.add("q-in");
  document.getElementById("hud-q").textContent = "Question " + (qIndex + 1) + " of " + round.length;
  document.getElementById("hud-score").textContent = score;
  document.getElementById("hud-streak").textContent = streak;
  document.getElementById("progress-bar").style.width = ((qIndex) / round.length * 100) + "%";
  document.getElementById("clue").textContent = card.clue;
  document.getElementById("roman").textContent = card.clue_pRoman || "";
  var box = document.getElementById("options");
  box.innerHTML = "";
  buildOptions(card, cards).forEach(function (ans) {
    var b = document.createElement("button");
    b.className = "opt";
    b.textContent = ans;
    b.addEventListener("click", function () { answer(b, ans, card); });
    box.appendChild(b);
  });
}

function answer(btn, ans, card) {
  if (locked) return;
  locked = true;
  var correct = String(ans).toLowerCase() === String(card.answer).toLowerCase();
  document.querySelectorAll(".opt").forEach(function (o) {
    o.disabled = true;
    if (String(o.textContent).toLowerCase() === String(card.answer).toLowerCase()) o.classList.add("correct");
  });
  if (correct) {
    score++; streak++;
    if (streak > bestStreak) bestStreak = streak;
    var hs = document.getElementById("hud-score");
    hs.classList.remove("pop"); void hs.offsetWidth; hs.classList.add("pop");
  } else {
    btn.classList.add("wrong");
    streak = 0;
  }
  document.getElementById("hud-score").textContent = score;
  document.getElementById("hud-streak").textContent = streak;
  document.getElementById("progress-bar").style.width = (((qIndex + 1)) / round.length * 100) + "%";
  setTimeout(function () {
    qIndex++;
    if (qIndex < round.length) renderQuestion();
    else showResults();
  }, 1100);
}

function showResults() {
  document.getElementById("result-score").textContent = score + " / " + round.length;
  document.getElementById("result-set").textContent = currentSet.SetName;
  document.getElementById("result-correct").textContent = score;
  document.getElementById("result-acc").textContent = Math.round(score / round.length * 100) + "%";
  document.getElementById("result-best").textContent = bestStreak;
  var frac = score / round.length;
  document.getElementById("result-msg").textContent =
    frac === 1 ? "Perfect! 🏆" :
    frac >= 0.7 ? "Great job! Keep going." :
    frac >= 0.4 ? "Good effort — try again!" :
    "Keep practising, you'll get there!";
  // Win = 7 or more out of 10: trophy, confetti and share appear.
  var win = frac >= 0.7;
  document.getElementById("trophy").classList.toggle("show", win);
  document.getElementById("share-btn").classList.toggle("show", win);
  if (win) launchConfetti();
  show("screen-result");
}

var confettiRAF = null;
function stopConfetti() {
  if (confettiRAF) cancelAnimationFrame(confettiRAF);
  confettiRAF = null;
  var c = document.getElementById("confetti-canvas");
  if (c) c.style.display = "none";
}
function launchConfetti() {
  var canvas = document.getElementById("confetti-canvas");
  var ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  canvas.style.display = "block";
  var colors = ["#f43f5e", "#f59e0b", "#10b981", "#3b82f6", "#8b5cf6", "#ec4899"];
  var pieces = [];
  for (var i = 0; i < 120; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * canvas.height * 0.3,
      w: 6 + Math.random() * 6,
      h: 8 + Math.random() * 8,
      color: colors[i % colors.length],
      vy: 2 + Math.random() * 3,
      vx: -1.5 + Math.random() * 3,
      rot: Math.random() * Math.PI * 2,
      vr: -0.1 + Math.random() * 0.2
    });
  }
  var start = Date.now();
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    var alive = false;
    pieces.forEach(function (p) {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      if (p.y < canvas.height + 20) alive = true;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    if (alive && Date.now() - start < 4500) {
      confettiRAF = requestAnimationFrame(tick);
    } else {
      stopConfetti();
    }
  }
  tick();
}

function shareScore() {
  var text = "I scored " + score + "/" + round.length + " in the " + currentSet.SetName + " set on Artho Word Game! 🏆";
  var url = "https://sauravhhh.github.io/artho-word-game/";
  var btn = document.getElementById("share-btn");
  if (navigator.share) {
    navigator.share({ title: "Artho Word Game", text: text, url: url }).catch(function () {});
    return;
  }
  var done = function () {
    btn.textContent = "Copied!";
    setTimeout(function () { btn.textContent = "Share my score"; }, 2000);
  };
  var full = text + " " + url;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(full).then(done, function () { fallbackCopy(full, done); });
  } else {
    fallbackCopy(full, done);
  }
}
function fallbackCopy(text, done) {
  var ta = document.createElement("textarea");
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); done(); } catch (e) {}
  document.body.removeChild(ta);
}

document.getElementById("quit-btn").addEventListener("click", function () { show("screen-sets"); });
document.getElementById("again-btn").addEventListener("click", function () { startRound(currentSet); });
document.getElementById("change-btn").addEventListener("click", function () { stopConfetti(); show("screen-sets"); });
document.getElementById("share-btn").addEventListener("click", shareScore);

loadSets().then(function () {
  if (sets && sets.length) renderSets();
  else document.getElementById("sets-status").textContent = "Could not load word sets. Check your connection and reload.";
});
</script>
</body>
</html>
